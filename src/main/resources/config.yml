# ============================================================================
#  SOYSOceanBox - 主配置文件
# ----------------------------------------------------------------------------
#  一个 Minecraft 抽奖插件：玩家通过指令抽奖，产出待领取奖励后再领取。
#  强制依赖: Vault（经济）、PlayerPoints（点券）、PlaceholderAPI
#
#  修改本文件后使用 /soceanboxadmin reload 重载。
#  注意: storage.backends 下的后端启停属于结构性变更，重载后会重建存储连接，
#        建议在无人在线时操作。
# ============================================================================

# 配置文件版本，用于自动升级检测，请勿手动修改
config-version: 1


# ============================================================================
#  通用设置
# ============================================================================
general:
  language: zh_CN
  debug: false


# ============================================================================
#  数据存储
# ----------------------------------------------------------------------------
#  【多后端】
#  三种后端可同时开启。优先级固定为: MYSQL > SQLITE > YAML
#  已启用的后端中优先级最高者为「主存储」，负责所有读操作；
#  其余启用的后端作为「辅助存储」，写入时被镜像同步，充当热备份。
#  例: 同时开启 mysql 与 yaml -> MySQL 为主库，yaml 自动保持一份可读的本地副本。
#
#  【互转与覆盖】
#  使用 /soceanboxadmin migrate <来源> <目标> 在任意两个后端之间转换数据，
#  使用 /soceanboxadmin sync 将主存储的全量数据覆盖写入所有辅助存储。
# ============================================================================
storage:

  backends:

    # ---------- YAML（默认启用，零依赖） ----------
    yaml:
      enabled: true
      file: data/players.yml
      backup-on-save: false

    # ---------- SQLite（默认禁用） ----------
    sqlite:
      enabled: false
      file: data/players.db
      table-prefix: 'mc_sob_'

    # ---------- MySQL（默认禁用，启用后自动成为主存储） ----------
    mysql:
      enabled: false
      url: 'jdbc:mysql://localhost:3306/minecraft?useUnicode=true&characterEncoding=utf8&autoReconnect=true&useSSL=false&serverTimezone=Asia/Shanghai'
      username: root
      password: ''
      table-prefix: 'mc_sob_'
      keepalive-interval: 1800

  # --------------------------------------------------------------
  #  辅助存储镜像写入
  # --------------------------------------------------------------
  mirror:
    enabled: true
    async: true
    sync-on-startup: false


# ============================================================================
#  指令设置
# ----------------------------------------------------------------------------
#  提示: 抽奖核心规则（冷却 / 消耗 / 奖池）已迁移至 lottery.yml。
# ============================================================================
command:
  tab-complete: true


# ============================================================================
#  PlaceholderAPI 变量
# ----------------------------------------------------------------------------
#  可用变量:
#    %soysoceanbox_pending%      待领取奖励数量
#    %soysoceanbox_total_draws%  累计抽奖次数
#    %soysoceanbox_last_draw%    上次抽奖时间戳（毫秒）
# ============================================================================
placeholder:
  no-pending: '&7暂无待领取奖励'
  date-format: 'yyyy-MM-dd HH:mm'
