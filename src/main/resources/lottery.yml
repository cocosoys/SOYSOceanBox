# ============================================================================
#  SOYSOceanBox - 抽奖核心规则配置文件
# ----------------------------------------------------------------------------
#  本文件专用于抽奖规则，与 config.yml 分离，便于单独维护奖池与消耗策略。
#
#  修改本文件后使用 /soceanboxadmin reload 重载。
#  注: 抽奖规则属于「热重载安全」配置，重载后立即生效，无需重启服务器。
# ============================================================================

# 配置文件版本，用于自动升级检测，请勿手动修改
config-version: 6


# ============================================================================
#  抽奖核心规则
# ============================================================================

# 两次抽奖之间的最小间隔（秒），0 = 无冷却
cooldown-seconds: 3

# 抽奖消耗
cost:
  # 是否启用消耗
  enabled: true
  # 消耗类型: money（Vault 经济）| points（PlayerPoints 点券）
  type: points
  # 每次抽奖消耗的数量
  amount: 100

# 中奖是否全服广播
broadcast-big-win: true
# 触发广播的最高权重（仅当 broadcast-big-win 为 true 时生效）；
# 0 = 不按权重筛选（任何中奖都广播）；>0 = 仅当奖项权重 <= 该值时广播（权重越小越稀有）
broadcast-below-weight: 15

# ============================================================
#  待领取奖励过期（TTL）
# ------------------------------------------------------------
#  抽奖产出的待领取奖励在 expire-after 秒后自动失效（被 claim/list 清理）。
#  0 = 永不过期（默认，奖励永久保留直到领取）。
#  例：设为 86400 表示待领取奖励仅保留 1 天。
# ============================================================
pending:
  expire-after: 0

# ============================================================
#  个人中奖记录
# ------------------------------------------------------------
#  每位玩家保留最近 keep 条中奖记录（用于 /soceanbox history 与 stats）。
#  0 = 不记录（关闭历史功能，节省存储）。
# ============================================================
history:
  keep: 50

# ============================================================
#  每日 / 每周抽奖上限
# ============================================================
limits:
  daily:
    enabled: false
    amount: 50
  weekly:
    enabled: false
    amount: 200

# ============================================================
#  概率保底（pity）
# ------------------------------------------------------------
#  玩家连续未抽中「保底池」奖项的次数达到 after 后，
#  下一次抽奖将强制从 pity.pool 中列出的奖项抽取。
# ============================================================
pity:
  enabled: false
  after: 50
  # 保底池：连续未抽中保底池奖项达到 after 次后，下一次强制从保底池抽取。
  # 支持两种写法（可混用，旧式平铺列表权重均为 1）：
  #   pool: [emerald_cmd, diamond]
  #   pool:
  #     - id: emerald_cmd
  #       weight: 3
  #     - id: diamond
  #       weight: 1
  pool:
    - id: emerald_cmd
      weight: 3
    - id: diamond
      weight: 1

# ============================================================
#  抽奖前置条件（require）
# ------------------------------------------------------------
#  满足以下全部条件才允许抽奖；任意一项留空/为 0 即不限制该项。
#  permission: 需持有的权限节点（如 soysoceanbox.vip）
#  level:      需达到的玩家经验等级（XP level，原版概念）
#  item:       背包中需持有的物品（材质 + 数量）
# ============================================================
require:
  permission: ''
  level: 0
  item:
    material: ''
    amount: 1

# ============================================================
#  音效与动画效果
# ------------------------------------------------------------
#  抽奖/领取时的音效、粒子、标题等视觉反馈，提升体验。
#  音效名称使用 Spigot 1.12.2 的 Sound 枚举名，留空表示不播放。
#  粒子名称使用 Particle 枚举名。
# ============================================================
effects:

  # ---------- 抽奖成功 ----------
  draw:
    # 抽奖成功时播放的音效（如 ENTITY_EXPERIENCE_ORB_PICKUP），留空关闭
    sound: 'ENTITY_EXPERIENCE_ORB_PICKUP'
    volume: 1.0
    pitch: 1.0
    # 抽奖成功时在玩家位置播放的粒子效果，enabled=false 关闭
    particles:
      enabled: true
      type: 'VILLAGER_HAPPY'
      count: 15
      offset-x: 0.5
      offset-y: 1.0
      offset-z: 0.5
      extra: 0.1

  # ---------- 领取成功 ----------
  claim:
    # 领取成功时播放的音效（如 ENTITY_ITEM_PICKUP），留空关闭
    sound: 'ENTITY_ITEM_PICKUP'
    volume: 1.0
    pitch: 1.2

  # ---------- 大额中奖（触发广播时）标题消息 ----------
  big-win:
    title-enabled: true
    title: '&6&l恭喜中奖！'
    subtitle: '&e获得 {reward}'
    # 标题淡入/停留/淡出时间（游戏刻，20刻=1秒）
    fade-in: 10
    stay: 40
    fade-out: 10
    # 大额中奖时额外播放的音效（留空则使用 draw.sound）
    sound: 'ENTITY_ENDERDRAGON_GROWL'
    volume: 1.0
    pitch: 0.8

# ============================================================
#  多奖池（v6 配置块结构）
# ------------------------------------------------------------
#  default-pool: 默认生效的奖池名
#  allow-player-switch: 是否允许玩家用 /soceanbox pool <名称> 自行切换
#
#  每个奖池 pools.<名称> 是一个配置块：
#    enabled: 是否启用（false 时该奖池对玩家不可见、不可抽取，对应后台「启用/禁用」）
#    start / end: 限时窗口（格式 yyyy-MM-dd HH:mm，服务器本地时区），留空为常驻
#    rewards: 奖项列表（每项字段：id / type / weight / display / amount / material ...）
#
#  升级说明：v5 的「奖项裸列表」会在加载时自动迁移为本结构（奖项与玩家数据不变）。
#
#  例（限时节日奖池）：
#    festival:
#      enabled: true
#      start: '2026-12-24 00:00'
#      end:   '2026-12-26 00:00'
#      rewards:
#        - id: xmas_gift
#          type: item
#          material: NETHER_STAR
#          amount: 1
#          weight: 100
#          display: '&e圣诞限定礼物'
# ============================================================
default-pool: default
allow-player-switch: true

pools:
  default:
    enabled: true
    start: ''
    end: ''
    rewards:
      - id: coins
        type: money
        amount: 1000
        weight: 40
        display: '&e1000 金币'
      - id: points
        type: points
        amount: 50
        weight: 30
        display: '&b50 点券'
      - id: diamond
        type: item
        material: DIAMOND
        amount: 1
        weight: 20
        display: '&b钻石 x1'
      - id: emerald_cmd
        type: command
        command: 'give {player} minecraft:emerald 1'
        weight: 10
        display: '&a绿宝石 x1（指令发放）'

  # 示例第二个奖池：管理员可用 /soceanboxadmin setpool <玩家> vip 指定
  vip:
    enabled: true
    start: ''
    end: ''
    rewards:
      - id: vip_money
        type: money
        amount: 5000
        weight: 50
        display: '&e5000 金币'
      - id: vip_item
        type: item
        material: DIAMOND_BLOCK
        amount: 1
        weight: 30
        display: '&d★ VIP 专属钻石块 ★'
        name: '&d&l★ VIP 专属 ★'
        lore:
          - '&7尊贵身份的专属奖励'
      - id: vip_cmd
        type: command
        command: 'give {player} minecraft:diamond 3'
        weight: 20
        display: '&b钻石 x3（指令发放）'
