# ============================================================================
#  SOYSOceanBox - 抽奖核心规则配置文件
# ----------------------------------------------------------------------------
#  本文件专用于抽奖规则，与 config.yml 分离，便于单独维护奖池与消耗策略。
#
#  修改本文件后使用 /soceanboxadmin reload 重载。
#  注: 抽奖规则属于「热重载安全」配置，重载后立即生效，无需重启服务器。
# ============================================================================

# 配置文件版本，用于自动升级检测，请勿手动修改
config-version: 4


# ============================================================================
#  抽奖核心规则
# ============================================================================

# 两次抽奖之间的最小间隔（秒），0 = 无冷却
cooldown-seconds: 3

# 抽奖消耗
cost:
  # 是否启用消耗
  enabled: true
  # 消耗类型: money（Vault 经济）| points（PlayerPoints 点券）
  type: points
  # 每次抽奖消耗的数量
  amount: 100

# 中奖是否全服广播
broadcast-big-win: true
# 触发广播的最高权重（仅当 broadcast-big-win 为 true 时生效）；
# 0 = 不按权重筛选（任何中奖都广播）；>0 = 仅当奖项权重 <= 该值时广播（权重越小越稀有）
broadcast-below-weight: 15

# ============================================================
#  待领取奖励过期（TTL）
# ------------------------------------------------------------
#  抽奖产出的待领取奖励在 expire-after 秒后自动失效（被 claim/list 清理）。
#  0 = 永不过期（默认，奖励永久保留直到领取）。
#  例：设为 86400 表示待领取奖励仅保留 1 天。
# ============================================================
pending:
  expire-after: 0

# ============================================================
#  个人中奖记录
# ------------------------------------------------------------
#  每位玩家保留最近 keep 条中奖记录（用于 /soceanbox history 与 stats）。
#  0 = 不记录（关闭历史功能，节省存储）。
# ============================================================
history:
  keep: 50

# ============================================================
#  每日 / 每周抽奖上限
# ============================================================
limits:
  daily:
    enabled: false
    amount: 50
  weekly:
    enabled: false
    amount: 200

# ============================================================
#  概率保底（pity）
# ------------------------------------------------------------
#  玩家连续未抽中「保底池」奖项的次数达到 after 后，
#  下一次抽奖将强制从 pity.pool 中列出的奖项抽取。
# ============================================================
pity:
  enabled: false
  after: 50
  # 保底池：连续未抽中保底池奖项达到 after 次后，下一次强制从保底池抽取。
  # 支持两种写法（可混用，旧式平铺列表权重均为 1）：
  #   pool: [emerald_cmd, diamond]
  #   pool:
  #     - id: emerald_cmd
  #       weight: 3
  #     - id: diamond
  #       weight: 1
  pool:
    - id: emerald_cmd
      weight: 3
    - id: diamond
      weight: 1

# ============================================================
#  抽奖前置条件（require）
# ------------------------------------------------------------
#  满足以下全部条件才允许抽奖；任意一项留空/为 0 即不限制该项。
#  permission: 需持有的权限节点（如 soysoceanbox.vip）
#  level:      需达到的玩家经验等级（XP level，原版概念）
#  item:       背包中需持有的物品（材质 + 数量）
# ============================================================
require:
  permission: ''
  level: 0
  item:
    material: ''
    amount: 1

# ============================================================
#  多奖池
# ------------------------------------------------------------
#  default-pool: 默认生效的奖池名
#  allow-player-switch: 是否允许玩家用 /soceanbox pool <名称> 自行切换
#  pools.<名称>: 每个奖池是一组奖项（字段同单奖池）
#
#  限时 / 节日奖池：在奖池下加 start / end（格式 yyyy-MM-dd HH:mm，服务器本地时区）
#  其时间窗口内的奖池才会被抽取；窗口外的奖池在 /soceanbox pool 中标记「已结束/未开始」。
#  未配置 start/end 的奖池为常驻（始终生效）。
#  例：
#    festival:
#      start: '2026-12-24 00:00'
#      end:   '2026-12-26 00:00'
#      - id: xmas_gift
#        type: item
#        material: NETHER_STAR
#        amount: 1
#        weight: 100
#        display: '&e圣诞限定礼物'
# ============================================================
default-pool: default
allow-player-switch: true

pools:
  default:
    - id: coins
      type: money
      amount: 1000
      weight: 40
      display: '&e1000 金币'
    - id: points
      type: points
      amount: 50
      weight: 30
      display: '&b50 点券'
    - id: diamond
      type: item
      material: DIAMOND
      amount: 1
      weight: 20
      display: '&b钻石 x1'
    - id: emerald_cmd
      type: command
      command: 'give {player} minecraft:emerald 1'
      weight: 10
      display: '&a绿宝石 x1（指令发放）'

  # 示例第二个奖池：管理员可用 /soceanboxadmin setpool <玩家> vip 指定
  vip:
    - id: vip_money
      type: money
      amount: 5000
      weight: 50
      display: '&e5000 金币'
    - id: vip_item
      type: item
      material: NETHERITE_INGOT
      amount: 1
      weight: 30
      display: '&d下界合金锭 x1'
      custom-model-data: 1001
      nbt: '{display:{Name:"{\"text\":\"★ VIP 专属 ★\"}"}}'
    - id: vip_cmd
      type: command
      command: 'give {player} minecraft:diamond 3'
      weight: 20
      display: '&b钻石 x3（指令发放）'
